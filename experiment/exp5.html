<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Green Leaf Nursery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e6f3e6;
            color: #1f4221;
        }

        main {
            width: min(400px, calc(100% - 32px));
            margin: 60px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        a {
            color: #2f7b2f;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #aac9aa;
            border-radius: 6px;
            font: inherit;
        }

        button {
            margin-top: 16px;
            background-color: #3f8f3f;
            border-color: #3f8f3f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #367b36;
        }

        .error {
            display: block;
            min-height: 18px;
            margin-bottom: 8px;
            color: #c0392b;
            font-size: 0.85rem;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 560px) {
            main {
                margin: 20px auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <a href="../index.html">← Back to experiments</a>

        <h1>Green Leaf Login</h1>

        <form id="login-form" novalidate>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">
            <span class="error" id="username-error"></span>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="you@example.com">
            <span class="error" id="email-error"></span>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error" id="password-error"></span>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </main>

    <script>
        var form = document.getElementById("login-form");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            var username = document.getElementById("username").value.trim();
            var email = document.getElementById("email").value.trim();
            var password = document.getElementById("password").value;
            var valid = true;

            document.getElementById("username-error").textContent = "";
            document.getElementById("email-error").textContent = "";
            document.getElementById("password-error").textContent = "";
            document.getElementById("message").textContent = "";

            // Username: required, at least 3 characters
            if (username === "") {
                document.getElementById("username-error").textContent = "Username is required.";
                valid = false;
            } else if (username.length < 3) {
                document.getElementById("username-error").textContent = "Username must be at least 3 characters.";
                valid = false;
            }

            // Email: required, must match a simple pattern
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === "") {
                document.getElementById("email-error").textContent = "Email is required.";
                valid = false;
            } else if (!emailPattern.test(email)) {
                document.getElementById("email-error").textContent = "Enter a valid email address.";
                valid = false;
            }

            // Password: required, at least 6 characters
            if (password === "") {
                document.getElementById("password-error").textContent = "Password is required.";
                valid = false;
            } else if (password.length < 6) {
                document.getElementById("password-error").textContent = "Password must be at least 6 characters.";
                valid = false;
            }

            if (valid) {
                var message = document.getElementById("message");
                message.style.color = "#2f7b2f";
                message.textContent = "Login successful! Welcome, " + username + ".";
                form.reset();
            }
        });
    </script>
</body>
</html>
